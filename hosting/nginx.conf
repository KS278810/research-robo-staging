# ResearchRobo 静的配信設定。Dockerfileが /etc/nginx/conf.d/default.conf として配置する。
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    server_tokens off;
    autoindex     off;
    # 2026-10-14(実機検証): 既定(on)だと /assets → /assets/ の301が「listenポート(80)」の絶対URLになり、
    # RR_PORT=18081 のように公開ポートを変えた運用やリバースプロキシ配下ではポート/ホストが落ちて
    # 別の場所へ飛ぶ（http://127.0.0.1/assets/ を実測）。相対Locationにして、見えているURLのまま辿らせる
    absolute_redirect off;

    # nginx既定のMIME表を先に取り込み、その上で.md（既定に無い）だけ追加する。
    # server内のtypesブロックはhttp層の表を"上書き"するため、この順で足りないぶんだけ補う。
    include      /etc/nginx/mime.types;
    types { text/markdown md; }
    default_type application/octet-stream;

    charset       utf-8;
    charset_types text/plain text/css text/xml text/markdown application/javascript application/json image/svg+xml;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css text/xml text/markdown application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 隠しファイル（.git/*, .gitignore等）は常に隠す。イメージにはそもそも.git等は
    # コピーされないが、多層防御として明示的に拒否する
    location ~ /\. {
        return 404;
    }

    location = /LICENSE {
        default_type text/plain;
        add_header Cache-Control "no-cache";
        # add_header はこのlocationで1つでも書くと上位の指定を継承しない。location / と同じ組を明示する
        # （2026-10-14実機: 無いとLICENSEだけ nosniff / Referrer-Policy が付かなかった）
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # ディレクトリURL（末尾スラッシュ付きの /assets/ 等）は常に404にする。公開物にindexを持つ
    # ディレクトリは無く、autoindex off のままだと try_files の $uri/ が 403 を返す（実機で /assets/ → 403 を実測。
    # serve.py・GitHub Pages は404）。「/」自体は ^/.+/$ に合わないので index.html が従来どおり返る
    location ~ ^/.+/$ {
        return 404;
    }

    # 画像・PDFは長期キャッシュ（内容が変わるときはファイル名ごと変える運用ではないため
    # 短め。社内配信では更新頻度が低い想定）
    location ~* \.(png|webp|ico|svg|pdf)$ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # HTML・KIT本文(.md)・JSは常に再検証させる（KIT更新やバグ修正が即反映されるように）
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ =404;
    }
}

# サブパス配信（例: https://intra.example/tools/rr/）にする場合、この設定ファイル自体は
# 変更不要。上位のリバースプロキシ側で以下のように転送する:
#
#   location /tools/rr/ {
#       proxy_pass http://research-robo:80/;   # 末尾スラッシュ必須
#       proxy_set_header Host $host;
#   }
